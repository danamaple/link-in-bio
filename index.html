<!DOCTYPE html>
<html>
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
    
    <style>
    *{
      border: 1px red dashed;
      }
      
    html {
        min-height: 100%;
      }

      body {
        min-height: 100%;
        padding-top:40px;
        padding-bottom: 40px;
        background-color: #f1f4ff;
        font-family: "Playfair Display";
      }
      a{
        border:none;
        text-decoration:none;
      }
      .item {
    width: 200px;
    padding: 20px;
    border-radius: 1000px;
    border: solid red 5px;
    margin: 30px;
    background-color: #ffffff;
    }
    .name-row{
      border: dashed red 5px;
      font-size: 60px;
      font-weight: 100;
      color:#0c1d2f;
      text-align: center;
      }
      .main-container{
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
        border: dashed blue 5px;
        max-width: 640px;
        margin: auto;
      }
     
        .social-icons {
      width: 200px;
      padding: 20px;
      border: solid red 5px;
      font-size: 40 px;
      color: #0f1d55;
      margin: 30px;
      text-align: center;
      }

      .item-description {
        font-size: 40 px;
        color: #0f1d55;
        font-family: "playfair";
        text-align: center;
      }

      .avatar-image{
        width: 128px;
        height:128px;
        border-radius:128px;
        object-fit: cover;
      }
      
      .link-image{
        width: 120px;
        height:48px;
        object-fit: contain;
      }
      
    </style>
  </head>
  <body> 

    <div class = "main-container">
      <div class = "name-row">
          Dan
        </div>

      <div class = "image-row">
          <img class="avatar-image" src="/Images/Dan Profile Picture.jpg">
        </div>
      
        <div class = "social-icons">
         <a href="https://www.linkedin.com/in/dan-rowe-2322bb181/" target="_blank"> 
          <i class="fa-brands fa-linkedin-in"></i>
         </a> 

         <a href="https://github.com/danamaple" target="_blank"> 
          <i class="fa-brands fa-github"></i>
         </a> 

         <a href="https://www.instagram.com/rowedanny/?hl=en" target="_blank">

         </a>
      </div>

      <div class = "links-column">

        <div class = "item">

         <a href="https://www.inzollo.com/" target="_blank"> 
          <img class = "link-image" src="/Images/Inzollo.png" alt = "Inzollo">
         </a>

          Manage your operation with one platform 
         </div>
        </div>

        <div class = "item">
          <a href="https://drowe.substack.com/?utm_source=navbar&utm_medium=web&r=21vqkf" target="_blank"> 
          <img class = "link-image" src="/Images/Offworld.png" alt = "Offworld">

         </div>
         </div>

      </div>
    </div>
