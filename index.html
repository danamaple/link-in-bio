<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title> Dan Rowe's Links </title>
    <style>
    *{
      border: 1px red dashed;
      text-align: center;
      }
      .name-row{
      border: dashed red 5px;
      }
      .main-container{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: dashed blue 5px;
      }
      .text {
    width: 200px;
    padding: 20px;
    border: solid red 5px;
    margin: 30px;
    }
      .social-icons-row{
        display: flex;
        flex-direction: row;
        justify-content: center;
        border: dashed red 5px;
      }
        .social-icons {
      width: 200px;
      padding: 20px;
      border: solid red 5px;
      margin: 30px;
      }
      body {
        padding-top:40px;
        padding-bottom: 40px;
      }

      .avatar-image{
        width: 128px;
        height:128px;
        object-fit: cover;
      }
      .icon-image{
        width: 48px;
        height:48px;
        object-fit: cover;
      }
      .link-image{
        width: 120px;
        height:48px;
        object-fit: cover;
      }
      a{
        border:none;
      }
    </style>
  </head>
  <body> 

    <div class = "main-container">
      <div class = "name-row">
          Dan Rowe!
        </div>

      <div class = "image-row">
          <img class="avatar-image" src="/Images/Dan Profile Picture.jpg">
        </div>
        
        <div class = "social-icons">
         <a href="https://www.linkedin.com/in/dan-rowe-2322bb181/" target="_blank"> 
          <img class = "icon-image" src="/Images/Linkedin Logo.png" alt = "Linkedin">
         </a> 

         <a href="https://github.com/danamaple" target="_blank"> 
          <img class = "icon-image" src="/Images/GitHub_Logo.png" alt = "Github">
         </a> 

         <a href="https://www.instagram.com/rowedanny/?hl=en" target="_blank"> 
          <img class = "icon-image" src="/Images/Instagram_Glyph_Gradient.png" alt = "Instagram">
         </a>
      </div>

      <div>
      <div class = "links-column">

        <div class = "links">

         <a href="https://www.inzollo.com/" target="_blank"> 
          <img class = "link-image" src="/Images/Inzollo.png" alt = "Inzollo">
         </a>
        </div>

        <div class = "links">
          <a href="https://drowe.substack.com/?utm_source=navbar&utm_medium=web&r=21vqkf" target="_blank"> 
          <img class = "link-image" src="/Images/Offworld.png" alt = "Offworld">
         </a>
         </div>

      </div>
    </div>
  </body>

</html>
